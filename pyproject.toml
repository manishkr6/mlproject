[project]
name = "mlproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manishkr6", email = "manishkr8927@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "flask>=3.1.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
